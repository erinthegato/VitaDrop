<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VitaDrop</title>
<style>
  :root {
    --sky: #34beed; --sky-dark: #1692cb; --sky-lite: #84dbf7; --border: #c6e1ee;
    --text: #444c56; --dim: #8c96a1; --green: #46b446; --red: #e25555;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", -apple-system, system-ui, sans-serif;
    /* soft pinstripes */
    background: repeating-linear-gradient(#f8fbfd 0 5px, #eaf2f7 5px 8px);
    min-height: 100vh;
  }
  header {
    background: #fff; border-bottom: 4px solid var(--sky);
    box-shadow: 0 2px 0 var(--border);
    padding: 16px 20px 14px; display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { margin: 0; font-size: 28px; color: var(--sky); letter-spacing: .5px; }
  header span { color: var(--dim); font-size: 15px; }
  main { max-width: 520px; margin: 0 auto; padding: 22px 16px 60px; }
  .card {
    background: #fff; border: 3px solid var(--border); border-radius: 24px;
    padding: 22px 20px; box-shadow: 0 6px 18px rgba(52, 190, 237, .12);
  }
  .card h2 { margin: 0 0 6px; font-size: 22px; }
  .card p { margin: 0 0 20px; color: var(--dim); }
  /* glossy pill button */
  .btn {
    position: relative; display: block; text-align: center; cursor: pointer;
    color: #fff; font-size: 19px; font-weight: 700; letter-spacing: .3px;
    padding: 16px; border-radius: 999px; border: 2px solid var(--sky-dark);
    background: linear-gradient(#5fcff3, var(--sky) 55%, #22aee2);
    text-shadow: 0 1px 1px rgba(0, 90, 140, .35);
    box-shadow: 0 4px 0 #1484b8, 0 8px 16px rgba(22, 146, 203, .25);
    transition: transform .08s, box-shadow .08s;
  }
  .btn::before {   /* shine */
    content: ""; position: absolute; left: 14px; right: 14px; top: 4px; height: 38%;
    border-radius: 999px; background: linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,.1));
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1484b8, 0 4px 10px rgba(22, 146, 203, .25); }
  .row {
    background: #fff; border: 2px solid var(--border); border-radius: 18px;
    padding: 12px 16px; margin-top: 14px;
  }
  .n { font-weight: 700; word-break: break-all; }
  .bar { height: 12px; background: #dce9f1; border-radius: 999px; margin: 9px 0 6px; overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0; border-radius: 999px; transition: width .15s;
    background: linear-gradient(var(--sky-lite), var(--sky) 60%);
  }
  .s { font-size: 14px; color: var(--dim); }
  .ok .bar i { background: linear-gradient(#8fde8f, var(--green) 60%); }
  .ok .s { color: var(--green); font-weight: 600; }
  .err .bar i { background: var(--red); }
  .err .s { color: var(--red); font-weight: 600; }
  .hint { margin-top: 26px; text-align: center; font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
<header><h1>VitaDrop</h1><span>File Transfer</span></header>
<main>
  <div class="card">
    <h2>Send files to your Vita</h2>
    <p>Pick photos, videos or anything from Files.</p>
    <label class="btn">Choose files<input id="pick" type="file" multiple hidden></label>
  </div>
  <div id="list"></div>
  <p class="hint">Saved on the Vita in ux0:data/VitaDrop/<br>Keep this page open until every file says "Saved".</p>
</main>
<script>
  const pick = document.getElementById('pick');
  const list = document.getElementById('list');

  // Upload the chosen files one at a time.
  pick.onchange = async () => {
    const files = [...pick.files];
    pick.value = '';
    for (const file of files) await upload(file);
  };

  function upload(file) {
    return new Promise(done => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<div class="n"></div><div class="bar"><i></i></div><div class="s">Waiting...</div>';
      row.querySelector('.n').textContent = file.name;
      list.prepend(row);
      const bar = row.querySelector('i');
      const status = row.querySelector('.s');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload?name=' + encodeURIComponent(file.name));
      xhr.upload.onprogress = e => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        bar.style.width = pct + '%';
        status.textContent = pct + '%';
      };
      xhr.onload = () => {
        if (xhr.status === 200) {
          let reply = {};
          try { reply = JSON.parse(xhr.responseText); } catch (e) {}
          bar.style.width = '100%';
          status.textContent = 'Saved as ' + (reply.saved || file.name);
          row.classList.add('ok');
        } else {
          status.textContent = 'Failed (error ' + xhr.status + ')';
          row.classList.add('err');
        }
        done();
      };
      xhr.onerror = () => {
        status.textContent = 'Connection lost. Is the Vita app still open?';
        row.classList.add('err');
        done();
      };
      xhr.send(file);
    });
  }
</script>
</body>
</html>
